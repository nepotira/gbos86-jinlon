name: Build Kernel (Jinlon / Comet Lake)

on:
  push:
    branches:
      - feat/isolated-install
    paths:
      - '.github/workflows/build-kernel.yml'
  workflow_dispatch:
    inputs:
      extra_configs:
        description: 'Additional kernel config flags (space separated, e.g. FOO=y BAR=m)'
        required: false
        default: ''

jobs:
  build-kernel:
    name: Compile Custom WHL/CML Kernel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Free Disk Space on Runner
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "Reclaimed disk space:"
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone upstream gbos-x86
        run: |
          git clone --depth 1 https://github.com/linuxkid473/gbos-x86.git /tmp/gbos-x86

      - name: Patch Upstream Build Scripts and Overrides
        run: |
          python3 - << 'PYEOF'
          import sys

          # 1. Jinlon Overrides in configure_whl.py
          path = "/tmp/gbos-x86/kernel/configure_whl.py"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          target = "'KSU_X86_PATCH_SYSCALL_DISPATCHER': 'y',"
          overrides = """'KSU_X86_PATCH_SYSCALL_DISPATCHER': 'y',
              # Jinlon thermal management & ChromeOS EC (prevent 100% fail-safe fan)
              'INTEL_RAPL': 'y',
              'X86_PKG_TEMP_THERMAL': 'y',
              'INT340X_THERMAL': 'y',
              'INT3400_THERMAL': 'y',
              'INTEL_PCH_THERMAL': 'y',
              'CHROME_PLATFORMS': 'y',
              'CROS_EC': 'y',
              'CROS_EC_LPC': 'y',
              'CROS_EC_SYSFS': 'y',
              # Gamepad input drivers (Gamesir Nova Lite 2.4G dongle / xpad / joydev)
              'INPUT_JOYDEV': 'y',
              'JOYSTICK_XPAD': 'y',
              'JOYSTICK_XPAD_FF': 'y',
              'JOYSTICK_XPAD_LEDS': 'y',
              'INPUT_UINPUT': 'y',"""

          if target not in content:
              print(f"ERROR: Could not locate target in {path}", file=sys.stderr)
              sys.exit(1)

          new_content = content.replace(target, overrides, 1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(new_content)
          print("Successfully patched configure_whl.py with Jinlon overrides.")

          # 2. Use reliable git shallow fetch instead of flaky dynamic gitiles tarball
          fks_path = "/tmp/gbos-x86/kernel/fetch_kernel_sources.sh"
          with open(fks_path, "r", encoding="utf-8") as f:
              fks = f.read()

          target_dl = """  say "kernel source: android.googlesource.com kernel/common @ $KSRC_COMMIT"
  [ -f "$DL/$KSRC_TAR" ] || curl -fL --retry 5 -o "$DL/$KSRC_TAR" \\
    "https://android.googlesource.com/kernel/common/+archive/$KSRC_COMMIT.tar.gz"
  got=$(sha "$DL/$KSRC_TAR")
  [ "$got" = "$KSRC_SHA" ] || die "sha256 mismatch for $KSRC_TAR ($got); delete it and retry"
  docker run --rm -v "$VOL":/build -v "$DL":/dl:ro debian:trixie \\
    bash -c "set -e; mkdir -p /build/src; tar -xzf /dl/$KSRC_TAR -C /build/src\""""

          repl_dl = """  say "kernel source: shallow git fetch from android.googlesource.com @ $KSRC_COMMIT"
  rm -rf "$DL/src"
  mkdir -p "$DL/src"
  git -C "$DL/src" init
  git -C "$DL/src" remote add origin https://android.googlesource.com/kernel/common
  git -C "$DL/src" fetch --depth 1 origin "$KSRC_COMMIT"
  git -C "$DL/src" checkout FETCH_HEAD
  docker run --rm -v "$VOL":/build -v "$DL/src":/dl/src:ro debian:trixie \\
    bash -c "set -e; mkdir -p /build/src; cp -a /dl/src/. /build/src/; rm -rf /build/src/.git\""""

          if target_dl not in fks:
              print(f"ERROR: target_dl not found in {fks_path}", file=sys.stderr)
              sys.exit(1)

          fks = fks.replace(target_dl, repl_dl, 1)
          fks = fks.replace('cp -a /dl/clang-prebuilts/$CLANG_DIR /build/inputs/', 'cp -a /dl/clang-prebuilts/$CLANG_DIR /build/inputs/; ln -sf $CLANG_DIR /build/inputs/clang-r584948c')
          with open(fks_path, "w", encoding="utf-8") as f:
              f.write(fks)
          print("Successfully patched fetch_kernel_sources.sh (git pack protocol + clang-r584948c symlink).")

          # 3. Fix Clang directory reference in build_kernel.sh
          bk_path = "/tmp/gbos-x86/kernel/build_kernel.sh"
          with open(bk_path, "r", encoding="utf-8") as f:
              bk = f.read()
          bk = bk.replace('clang-r584948c', 'clang-r584948b')
          with open(bk_path, "w", encoding="utf-8") as f:
              f.write(bk)
          print("Successfully patched build_kernel.sh (Clang path aligned to clang-r584948b).")

          # 4. Tolerate built-in drivers in make_stage0_initramfs.sh
          ms_path = "/tmp/gbos-x86/kernel/make_stage0_initramfs.sh"
          with open(ms_path, "r", encoding="utf-8") as f:
              ms = f.read()
          ms = ms.replace('missing=$((missing+1))', 'echo "module $m built-in or omitted" # missing=$((missing+1))')
          with open(ms_path, "w", encoding="utf-8") as f:
              f.write(ms)
          print("Successfully patched make_stage0_initramfs.sh (built-in driver tolerance).")
          PYEOF
          grep -C 5 "INT340X_THERMAL" /tmp/gbos-x86/kernel/configure_whl.py

      - name: Fetch Busybox and Build Docker Container
        run: |
          cd /tmp/gbos-x86
          sh tools/fetch_busybox.sh
          docker build -t gbos-kbuild kernel/docker

      - name: Fetch Kernel Sources and Toolchain
        run: |
          cd /tmp/gbos-x86
          sh kernel/fetch_kernel_sources.sh

      - name: Compile Kernel and Stage0 Initramfs
        run: |
          cd /tmp/gbos-x86
          sh kernel/build_kernel.sh

      - name: Prepare Artifacts and Checksums
        run: |
          mkdir -p /tmp/artifacts
          cp /tmp/gbos-x86/usb/out/BOOTX64.EFI /tmp/artifacts/BOOTX64.EFI
          cd /tmp/artifacts
          sha256sum BOOTX64.EFI | tee SHA256SUMS.txt
          tar -czf /tmp/artifacts/modules.tar.gz -C /tmp/gbos-x86/usb modules/
          ls -lh /tmp/artifacts

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gbos-kernel-jinlon
          path: /tmp/artifacts/
          retention-days: 7
